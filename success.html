<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09080e"><meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Thank you | Mythic Housing</title>
<style>
:root{--bg:#09080e;--muted:#bbb0c9;--purple:#c69cff;color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.6;background:radial-gradient(ellipse 50% 45% at 85% 5%,#4a206445,transparent 80%),var(--bg)}
.card{width:min(560px,100%);padding:40px 34px;border-radius:24px;border:1px solid #4b3956;background:#17121f;box-shadow:0 25px 70px #0006;text-align:center}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-size:.89rem;font-weight:900;letter-spacing:.07em;text-align:left}
.brand-symbol{width:43px;height:43px;display:grid;place-items:center;border:1px solid #8d5bc4;border-radius:12px;background:linear-gradient(145deg,#41234d,#170d22);font-family:Georgia,serif;font-size:1.65rem}
.brand-line{line-height:1.05}.brand-line small{display:block;color:var(--purple);font-size:.56rem;letter-spacing:.3em;margin-top:6px}
.check{width:64px;height:64px;margin:30px auto 18px;border-radius:50%;display:grid;place-items:center;background:#192a22;border:1px solid #3e785b;color:#9ce3bb;font-size:1.8rem}
h1{font-size:clamp(2rem,6vw,2.7rem);letter-spacing:-.035em;line-height:1.12;margin:0 0 14px}
p{color:var(--muted);margin:0 0 26px}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:11px;border:1px solid #a66de3;background:linear-gradient(135deg,#9451db,#7f3fc6);color:#fff;font-weight:760;text-decoration:none;padding:13px 20px}
.btn:hover{background:#9d59e4}
</style>
</head>
<body>
<main class="card">
<a class="brand" href="/" aria-label="Mythic Housing home"><span class="brand-symbol">M</span><span class="brand-line">MYTHIC<small>HOUSING</small></span></a>
<div class="check" aria-hidden="true">✓</div>
<h1>Thank you. We got it.</h1>
<p>Your submission has been received and will be reviewed individually. Submitting is not a commitment to host an open house. We'll reach out using the contact details you provided.</p>
<a class="btn" href="/">Back to Mythic Housing <span aria-hidden="true">→</span></a>
</main>
</body>
</html>
